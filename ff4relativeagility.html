    <script>
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
        const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))
        
        const heroCheckbox = document.getElementById('hero');
        const vanillaCheckbox = document.getElementById('vanilla');
        heroCheckbox.addEventListener('change', () => { updateHero(); updateAgility(); });
        vanillaCheckbox.addEventListener('change', () => { updateAgility(); });

        const characterRows = document.querySelectorAll('#characterRow');
        const characterSelects = document.querySelectorAll('#characterSelect');
        const heroCheckboxes = document.querySelectorAll('#heroCheckbox');
        const bossSelect = document.getElementById('bossSelect');
        const agilityInputs = document.querySelectorAll('#agilityInput');
        const relativeAgilityInputs = document.querySelectorAll('#relativeAgilityInput');

        function updateHero(checkbox) {
            // Uncheck all other hero checkboxes
            heroCheckboxes.forEach(cb => {
                if (cb !== checkbox || !heroCheckbox.checked) {
                    cb.checked = false;
                }
            });
        }

        function RA(agility, anchorAgility) {
            if (anchorAgility === 0) {
                return 1;
            }

            return Math.max(1, Math.floor(anchorAgility * 5 / agility));
        }

        function updateAgility() {
            // First update the agility value for the boss location
            if (bossSelect.value !== "") {
                const bossAgility = bossSelect.value;
                agilityInputs[5].value = bossAgility;
            }

            let anchorIdx = null;
            let firstFoundIdx = null;
            [2, 0, 4, 1, 3].forEach(i => {
                characterRows[i].classList.remove('table-danger');

                if (anchorIdx !== null) {
                    return;
                }

                const thisCharacter = characterSelects[i];
                const thisAgility = parseInt(agilityInputs[i].value);

                // If vanilla agility flag is on and this is Cecil, this is the anchor
                if (vanillaCheckbox.checked && thisCharacter.value === "Cecil") {
                    anchorIdx = i;
                    return;
                }

                // If vanilla agility flag is off and this is the hero, this is the anchor
                if (!vanillaCheckbox.checked && heroCheckbox.checked && heroCheckboxes[i].checked) {
                    anchorIdx = i;
                    return;
                }

                // Otherwise, the anchor is the highest priority slot that is filled
                if ((thisCharacter.value !== "" || !isNaN(thisAgility)) && firstFoundIdx === null) {
                    firstFoundIdx = i;
                    return;
                }
            });

            anchorIdx = anchorIdx ?? firstFoundIdx;

            // Clear our calc
            relativeAgilityInputs.forEach(input => {
                input.value = "";
            });

            if (anchorIdx == null) {
                // No anchor found
                return;
            }

            characterRows[anchorIdx].classList.add('table-danger');

            let anchorAgility = parseInt(agilityInputs[anchorIdx].value);
            if (isNaN(anchorAgility)) {
                return;
            }

            for (let i = 0; i < relativeAgilityInputs.length; i++) {
                let slotAgility = parseInt(agilityInputs[i].value);

                // Couldn't parse, just skip
                if (isNaN(slotAgility)) {
                    continue;
                }

                // Every valid agility slot is a minimum of 1
                slotAgility = Math.max(1, slotAgility);

                // If the anchor agility is 0, set every relative agility to 1
                if (anchorAgility === 0) {
                    relativeAgilityInputs[i].value = 1;
                    continue;
                }

                if (i === 5) {
                    if (agilityInputs[i].value.indexOf("..") !== -1) {
                        let range = agilityInputs[i].value;
                        let [min, max] = range.split("..").map(Number);
                        let minRA = RA(min, anchorAgility);
                        let maxRA = RA(max, anchorAgility);
                        relativeAgilityInputs[i].value = (minRA === maxRA) ? maxRA : `${RA(max, anchorAgility)}..${RA(min, anchorAgility)}`;
                    } else {
                        relativeAgilityInputs[i].value = RA(Math.min(slotAgility, 255), anchorAgility);
                    }
                } else {
                    relativeAgilityInputs[i].value = RA(Math.min(slotAgility, 99), anchorAgility);
                }
            }
        }
